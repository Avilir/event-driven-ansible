---
- name: Basic run with custom host limit and job launching
  hosts: all
  sources:
    - ansible.eda.range:
        limit: 10
        delay: 0.5

  rules:
    - name: Run basic with custom host limit
      condition: event.i == 1
      actions:
        - run_job_template:
            organization: "{{ org_name | default('Default') }}"
            name: Launch_by_eda
            job_args:
              limit: "{{ event.hosts }}"